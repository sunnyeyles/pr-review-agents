# Publishes the GitHub Action to its own public repository.
#
# Consumers can only reference an action from a public repo, but this
# repository holds the source we intend to license. So the split: build here,
# publish only the artefacts a consumer needs — action.yml, the bundled
# dist/index.mjs, LICENSE, and usage docs — into a thin public repo. The
# engine, the tests, the spec, and the Terraform stay private.
#
# Required repository configuration:
#
#   vars.ACTION_RELEASE_REPO     target public repo, e.g. sunnyeyles/pr-review-action
#   secrets.ACTION_RELEASE_TOKEN PAT (or app token) with contents:write on it
#
# Both are mandatory: the preflight job below fails the release before any
# checkout runs if either is missing, because actions/checkout would otherwise
# fall back to this repository and the default workflow token.
#
# Tagging a release here (v1.2.3) publishes that exact tag downstream and moves
# the major alias (v1) to it, which is the convention consumers pin against.

name: Release action

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v1.2.3)
        required: true

permissions:
  contents: read

concurrency:
  group: release-action
  cancel-in-progress: false

jobs:
  # Runs to completion before anything else in this workflow starts, which
  # is the whole point: actions/checkout treats an empty `repository:` as
  # "this repository" and an empty `token:` as the default workflow token,
  # so an unconfigured release would quietly stage the published payload
  # over this source tree and force-push tags onto it. A separate job the
  # publish job `needs:` makes that impossible to reach by accident — no
  # step of the release job runs until this one has passed.
  preflight:
    name: Check release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require a destination repository and a push token
        env:
          # Referenced by name only; the token's value is never printed,
          # only tested for emptiness.
          RELEASE_REPO: ${{ vars.ACTION_RELEASE_REPO }}
          RELEASE_TOKEN: ${{ secrets.ACTION_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ok=true

          if [ -z "${RELEASE_REPO:-}" ]; then
            echo "::error::Repository variable ACTION_RELEASE_REPO is not set. Set it to the public action repository (owner/repo, e.g. sunnyeyles/pr-review-action) under Settings > Secrets and variables > Actions > Variables."
            ok=false
          elif [ "${RELEASE_REPO:-}" = "${SOURCE_REPO:-}" ]; then
            echo "::error::ACTION_RELEASE_REPO points at this repository (${SOURCE_REPO}). It must name the separate public action repository, otherwise the release would overwrite the source tree."
            ok=false
          elif ! printf '%s' "${RELEASE_REPO:-}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::ACTION_RELEASE_REPO must be in owner/repo form (got '${RELEASE_REPO}')."
            ok=false
          fi

          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::Secret ACTION_RELEASE_TOKEN is not set. Create a PAT or app token with contents:write on the destination repository and store it under Settings > Secrets and variables > Actions > Secrets. Without it the publish checkout would fall back to the default workflow token, which has no access to the destination."
            ok=false
          fi

          if [ "${ok}" != true ]; then
            echo "::error::Release aborted before any checkout: the publish destination is not configured."
            exit 1
          fi

          echo "Destination repository and push token are configured."

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # Hard ordering: GitHub will not start this job — not even its first
    # checkout — unless preflight succeeded.
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The published bundle is what customers actually execute, so it
      # ships only from a green tree.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build action bundle
        run: pnpm --filter @pr-review/action build

      # Same check CI runs on every push: the artefact about to be published
      # imports cleanly under the action's Node major and stays inert without
      # the GITHUB_ACTIONS marker.
      - name: Smoke-test action bundle
        run: node scripts/smoke-bundle.mjs

      - name: Resolve release tag
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::tag must start with v (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"

      - name: Checkout the public action repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ACTION_RELEASE_REPO }}
          token: ${{ secrets.ACTION_RELEASE_TOKEN }}
          path: .release
          fetch-depth: 0

      # Replace the published tree wholesale rather than merging, so a
      # file deleted here disappears downstream too. .git is preserved.
      - name: Stage the published tree
        run: |
          set -euo pipefail
          find .release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p .release/dist
          cp apps/action/action.yml .release/action.yml
          cp apps/action/dist/index.mjs .release/dist/index.mjs
          cp apps/action/README.md .release/README.md
          # No `|| true`: both READMEs promise consumers a licence, so a
          # missing LICENSE must fail the release rather than ship without one.
          cp LICENSE .release/LICENSE

      - name: Commit and tag
        working-directory: .release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAJOR: ${{ steps.tag.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish for $TAG"
          else
            git commit -m "release: $TAG"
          fi
          git tag -f "$TAG"
          git tag -f "$MAJOR"
          git push origin HEAD:main
          git push origin -f "$TAG"
          git push origin -f "$MAJOR"
