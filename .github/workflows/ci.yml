name: CI

on:
  push:
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Nothing else exercises the bundle; a bundling regression fails here, not at release.
      - name: Build action bundle
        run: pnpm --filter @pr-review/action build

      # The bundle must import under the declared Node major and stay inert without GITHUB_ACTIONS.
      - name: Smoke-test action bundle
        run: node scripts/smoke-bundle.mjs
