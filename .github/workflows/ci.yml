name: CI

on:
  push:
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The bundle is what consumers execute, and nothing else exercises
      # it: typecheck and tests read the TypeScript sources. Building it
      # here turns a bundling regression into a failed pull request
      # instead of a failed release.
      - name: Build action bundle
        run: pnpm --filter @pr-review/action build

      # Runs the artefact itself under the Node major action.yml declares:
      # it must import cleanly, and it must do nothing at all while the
      # GITHUB_ACTIONS marker is absent.
      - name: Smoke-test action bundle
        run: node scripts/smoke-bundle.mjs
