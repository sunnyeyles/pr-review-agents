# Turns 👍 / 👎 reactions on the reviewer's own inline comments into Langfuse
# scores on the review run that produced each finding. This is the signal the
# prompt-improvement loop reads; it never touches a review in progress.
#
# Only reactions from people who can push to this repository count, so a
# drive-by click on a public repository cannot steer the prompts.
#
# Requires LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY repository secrets.
# Without them the run fails rather than silently recording nothing.

name: Collect review feedback

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      since-days:
        description: How many days of pull request activity to look back over.
        required: false
        default: "14"
      dry-run:
        description: Report what would be scored without writing to Langfuse.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: collect-feedback
  cancel-in-progress: false

jobs:
  collect:
    name: Score thumbs reactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: >-
          pnpm collect-feedback --
          --since-days ${{ inputs.since-days || '14' }}
          ${{ inputs.dry-run == true && '--dry-run' || '' }}
