# FROZEN — manual dispatch only.
#
# The AWS stack (API Gateway + Lambdas + SQS + Terraform) is the enterprise
# delivery path, not the default one. The default path is the GitHub Action in
# apps/action, which needs no AWS account. This workflow therefore no longer
# triggers on pushes to main: deploying infrastructure is a deliberate act, run
# by hand for the installations that want reviews off their CI.
#
# Frozen does NOT mean untested — ci.yml still typechecks and tests the webhook
# and worker apps on every push, so the stack cannot rot silently. See
# terraform/README.md for the support policy.
#
# Deploys via AWS OIDC — no long-lived AWS keys and no secrets in this file.
# Required repository *variables* (Settings → Secrets and variables → Actions →
# Variables; see terraform/README.md):
#
#   AWS_DEPLOY_ROLE_ARN  IAM role assumed via OIDC (bootstrap step)
#   AWS_REGION           deploy + state bucket region
#   TF_STATE_BUCKET      S3 bucket holding Terraform state
#   TF_STATE_KEY         state object key, e.g. pr-review-agents/terraform.tfstate
#   PR_REVIEW_GITHUB_APP_ID  numeric GitHub App ID (not a secret)

name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_app_id: ${{ vars.PR_REVIEW_GITHUB_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Lambda bundles
        run: pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: pr-review-agents-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false tfplan
