# Runs the evals in evals/ against real models, so manual only: real token spend.
# Unlike the self review, a missing provider key fails the run rather than skipping it.

name: Agent evaluations

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider to evaluate.
        required: false
        type: choice
        default: openai
        options:
          - openai
          - anthropic
      model:
        description: >-
          Model id to evaluate, as the provider spells it. Leave empty to
          evaluate that provider's default.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: agent-evaluations
  cancel-in-progress: false

jobs:
  evaluate:
    name: Review quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reports pass/fail per fixture and per expectation, and exits non-zero
      # if any expectation failed. The harness itself refuses to start without
      # a key, so a missing secret costs nothing and says so.
      - name: Run the agent evaluations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_PROVIDER: ${{ inputs.provider }}
          MODEL_ID: ${{ inputs.model }}
        run: pnpm eval
