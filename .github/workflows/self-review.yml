# Reviews this repository's own pull requests with the action built from the branch.
# Opt-in via the `ai-review` label; a missing provider key skips the job, not fails it.

name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Deliberately read: `fix` stays off here, so verified fixes arrive as
# suggested changes. Turning it on needs `contents: write` and `fix: "true"`.
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    # Opt in per pull request: no label, no review, no spend. The second
    # clause stops an unrelated label from paying for a re-review.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-review')
      && (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    steps:
      - name: Check for a model provider key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
        # Normalised as the action reads it; unknown names run so it fails loudly.
        run: |
          case "$(printf '%s' "$MODEL_PROVIDER" | tr '[:upper:]' '[:lower:]' | xargs)" in
            "" | openai) API_KEY="$OPENAI_API_KEY" ;;
            anthropic) API_KEY="$ANTHROPIC_API_KEY" ;;
            *) API_KEY="unknown provider" ;;
          esac
          if [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No model provider API key is set — skipping the self review"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # A local action must have its dist/ built before `uses: ./` runs it;
      # dist/ is gitignored, so it is always built here rather than committed.
      - name: Build the action
        if: steps.key.outputs.present == 'true'
        run: pnpm --filter @pr-review/action build

      - name: Review this pull request
        if: steps.key.outputs.present == 'true'
        uses: ./apps/action
        # The action reads the selected provider's key from these, so the
        # workflow never has to pick one.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          # Repository variables, so provider and model change without a commit.
          model-provider: ${{ vars.MODEL_PROVIDER }}
          model: ${{ vars.REVIEW_MODEL }}
          # Agents come from .github/pr-review-agents.yml at the base commit.
          # Set vars.REVIEW_AGENTS to e.g. `docs-drift` to pay for one agent only.
          agents: ${{ vars.REVIEW_AGENTS || 'all' }}
          # Optional: without these the action uses in-code prompts and no tracing.
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          # Keys are region-scoped: the wrong host 401s and drops every trace.
          langfuse-base-url: ${{ secrets.LANGFUSE_BASE_URL }}
