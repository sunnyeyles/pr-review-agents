# Dogfooding: this repository reviews its own pull requests with the action in
# apps/action, built from the branch under review rather than a published tag.
# If a change breaks the reviewer, it shows up on the pull request that made it.
#
# Requires the selected provider's API key as a repository secret — set
# vars.MODEL_PROVIDER to pick one, defaulting to Anthropic. With no key at all
# the job is skipped rather than failed, so forks and unconfigured clones stay
# green; the action itself decides which key the provider needs.

name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Check for a model provider key
        id: key
        env:
          ANY_KEY: ${{ secrets.ANTHROPIC_API_KEY }}${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$ANY_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No model provider API key is set — skipping the self review"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # A local action must have its dist/ built before `uses: ./` runs it;
      # dist/ is gitignored, so it is always built here rather than committed.
      - name: Build the action
        if: steps.key.outputs.present == 'true'
        run: pnpm --filter @pr-review/action build

      - name: Review this pull request
        if: steps.key.outputs.present == 'true'
        uses: ./apps/action
        # The action reads the selected provider's key from these, so the
        # workflow never has to pick one.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          # Set vars.MODEL_PROVIDER to review with a different provider.
          model-provider: ${{ vars.MODEL_PROVIDER }}
          # The agents come from .github/pr-review-agents.yml, read at the
          # pull request's base commit rather than from the checkout above.
          # Narrow the review from repository variables — set
          # vars.REVIEW_AGENTS to e.g. `architecture` to iterate on one
          # agent without paying for the others on every push.
          agents: ${{ vars.REVIEW_AGENTS || 'all' }}
          # Optional: absent secrets leave the action on the prompts built
          # from the config above, with no tracing.
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
