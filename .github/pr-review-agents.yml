# The review agents for this repository; the action fails if this file is missing.
# Entries name built-in agents (see the README). `paths` is a gate, not a filter.

agents:
  - agent: security
    paths:
      - "**/*.ts"
      - ".github/workflows/**"
  - agent: correctness
    paths:
      - "**/*.ts"
  - agent: performance
    paths:
      - "**/*.ts"
  # Tests live beside the sources they cover, so one gate reaches both.
  - agent: test-coverage
    paths:
      - "**/*.ts"
  # Code is what makes documentation stale, so this gate lets code through too.
  - agent: docs-drift
    paths:
      - "**/*.ts"
      - "**/*.md"
