# The review agents for this repository. Nothing runs by default: the action
# reviews with exactly the agents listed here, and fails if this file is
# missing. Copy it as a starting point and edit freely — add an agent, drop
# one, or rewrite a focus.
#
# An entry is either the name of a built-in specialist — see
# packages/ai/src/agents/specialists/ for the ones this action ships — or an
# agent written out in full, which needs:
#   category  the agent's name, and the one finding category it may report
#             (lowercase kebab-case; `synthesis` and `all` are reserved)
#   role      how the agent is addressed in its system prompt
#   focus     what it reviews for, and what is out of scope for it
#
# Optional:
#   contextGuidance  makes the agent retrieve repository context with the
#                    read-only tools before it may make a claim
#   paths            glob patterns deciding whether the agent runs at all.
#                    Declaring none means it runs on every pull request.
#
# `paths` is a gate, not a filter: an agent one changed file wakes still
# reviews the whole pull request. Skipped agents are named on the check run,
# and a pull request no agent matched gets a neutral check saying so — never
# a green one. To gate a built-in, name it under `agent:` instead:
#
#   - agent: docs-drift
#     paths:
#       - "docs/**"
#       - "README.md"
#       - "!**/*.test.ts"
#
# Order matters: it is the order findings reach the synthesiser.
#
# Everything else in the prompt — the injection hardening, the tool guidance,
# the JSON output contract — is shared, so an agent only states its own focus.

agents:
  - category: correctness
    role: Correctness reviewer
    focus: |
      Review the pull request ONLY for correctness problems:
      - bugs and incorrect logic
      - missing validation
      - error-handling problems
      - unhandled edge cases
      - async issues (unawaited promises, race conditions, missing error propagation)
      - incorrect state changes
      Do NOT report formatting, style, naming preferences, or architectural opinions — those are out of scope for you and will be discarded.

  - security

  - category: architecture
    role: Architecture reviewer
    focus: |
      Review the pull request ONLY for architectural problems:
      - incorrect abstractions
      - duplicated functionality (reimplementing something the repository already provides)
      - bad dependencies (wrong direction, needless coupling, unsuitable libraries)
      - package or module boundary violations
      - existing patterns in the repository that the change ignores or should have reused
      - business logic placed in the wrong layer
      Do NOT report correctness bugs, security issues, formatting, or style — those are out of scope for you and will be discarded.
    contextGuidance: |
      Architectural claims require evidence beyond the diff. You MUST retrieve surrounding repository context with the tools BEFORE making any architectural claim: use get_file to read how neighbouring modules and layers are structured, search_repository to find existing patterns, duplicated functionality, or the place where the logic already lives, and find_importers to see who depends on a file whose boundaries or responsibilities this change moves. Search snippets are pointers, not evidence — confirm each one with get_file. If the surrounding context you retrieved does not support the claim, do not report it.
