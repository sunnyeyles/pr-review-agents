name: AI PR Review
description: >-
  Reviews a pull request with the independent AI review agents the repository
  declares in .github/pr-review-agents.yml, and publishes an AI PR Review check run
  with inline annotations. No agents are built in.
author: sunnyeyles

branding:
  icon: check-circle
  color: purple

inputs:
  anthropic-api-key:
    description: >-
      Anthropic API key the review agents and Synthesiser authenticate with.
      Store it as a repository or organisation secret; never inline it.
    required: true
  github-token:
    description: >-
      Token used for the six read-only repository tools, for the review
      comments, and for publishing the check run. The default workflow token
      is enough when the job grants contents: read, pull-requests: write, and
      checks: write.
    required: false
    default: ${{ github.token }}
  model:
    description: Anthropic model id the agents and Synthesiser use.
    required: false
    default: claude-sonnet-5
  agents:
    description: >-
      Which of the configured review agents run: `all`, or a comma-separated
      subset of their names. Each agent is an independent set of model calls,
      so narrowing the set cuts cost roughly in proportion — use it to iterate
      on one agent without paying for the others. A name the configuration
      does not define fails the step before any model call, rather than
      quietly running a narrower review.
    required: false
    default: all
  agent-config:
    description: >-
      Path, relative to the checked-out workspace, to the YAML file declaring
      this repository's review agents. No agents are built in, so this file is
      required: a missing, malformed, or empty one fails the step rather than
      running a review nobody configured. Requires actions/checkout to have
      run.
    required: false
    default: .github/pr-review-agents.yml
  langfuse-public-key:
    description: >-
      Langfuse public key. Supply this and langfuse-secret-key to fetch the
      system prompts from Langfuse and export traces there. Leave both unset to
      run on the prompts built into this action, which is the default.
    required: false
    default: ""
  langfuse-secret-key:
    description: >-
      Langfuse secret key. Store it as a repository or organisation secret;
      never inline it.
    required: false
    default: ""
  langfuse-base-url:
    description: Langfuse host. Point this at your own instance if self-hosting.
    required: false
    default: https://cloud.langfuse.com
  langfuse-prompt-label:
    description: >-
      Label identifying which version of each prompt to fetch. Use this to try a
      prompt change on one repository before promoting it.
    required: false
    default: production

runs:
  using: node24
  main: dist/index.mjs
